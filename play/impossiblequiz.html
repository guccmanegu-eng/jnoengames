<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Classroom</title>

    <!-- 1. Explicitly create the favicon link element pointing to root assets -->
    <link id="favicon" rel="icon" type="image/x-icon" href="../assets/google-classroom.ico" />

    <!-- 2. Lock tab title and favicon protection script -->
    <script>
    (function lockHead() {
      const ORIGINAL_TITLE = "Classroom";
      const ORIGINAL_FAVICON = "../assets/google-classroom.ico";

      document.title = ORIGINAL_TITLE;

      const observer = new MutationObserver(() => {
        if (document.title !== ORIGINAL_TITLE) {
          document.title = ORIGINAL_TITLE;
        }

        let icon = document.querySelector("link[rel*='icon']");
        if (icon) {
          if (!icon.href.includes("google-classroom.ico")) {
            icon.href = ORIGINAL_FAVICON;
          }
        } else {
          icon = document.createElement("link");
          icon.rel = "icon";
          icon.type = "image/x-icon";
          icon.href = ORIGINAL_FAVICON;
          document.head.appendChild(icon);
        }
      });

      observer.observe(document.head || document.documentElement, {
        subtree: true,
        childList: true,
        characterData: true,
        attributes: true
      });
    })();
    </script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
      }

      #ruffle {
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <script src="/js/main.js"></script>
    <div id="ruffle"></div>
    <script src="ruffle.js"></script>
    <script>
      window.RufflePlayer = window.RufflePlayer || {};
      window.addEventListener("load", (event) => {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("ruffle");
        player.id = "player";
        player.style.width = "100%";
        player.style.height = "100%";
        container.appendChild(player);
        player.load("impossible_quiz1.swf");
      });
    </script>
  </body>
</html>
