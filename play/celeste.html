    <!-- 1. Favicon link stepping out of play/ to assets/ -->
    <link id="favicon" rel="icon" type="image/x-icon" href="../assets/google-classroom.ico" />
    <link rel="prefetch" id="mountainsrc" href="assets/mountain.png">
    <link rel="stylesheet" href="styles.css" />

        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Inter:wght@100..900&family=Material+Symbols+Rounded&display=swap"
        rel="stylesheet" />

    <!-- 2. Lock tab title and favicon protection script -->
    <script>
    (function lockHead() {
      const ORIGINAL_TITLE = "Classroom";
      const ORIGINAL_FAVICON = "../assets/google-classroom.ico";

      document.title = ORIGINAL_TITLE;

      const observer = new MutationObserver(() => {
        if (document.title !== ORIGINAL_TITLE) {
          document.title = ORIGINAL_TITLE;
        }

        let icon = document.querySelector("link[rel*='icon']");
        if (icon) {
          if (!icon.href.includes("google-classroom.ico")) {
            icon.href = ORIGINAL_FAVICON;
          }
        } else {
          icon = document.createElement("link");
          icon.rel = "icon";
          icon.type = "image/x-icon";
          icon.href = ORIGINAL_FAVICON;
          document.head.appendChild(icon);
        }
      });

      observer.observe(document.head || document.documentElement, {
        subtree: true,
        childList: true,
        characterData: true,
        attributes: true
      });
    })();
    </script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
    </style>

</head>
