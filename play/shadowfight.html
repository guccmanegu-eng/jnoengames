<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Page Game</title>
  <style>
    /* Remove default body margins/padding and hide scrollbars */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000; /* optional dark background */
    }

    /* Force the iframe to fill the viewport exactly */
    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

<iframe
    src="https://www.madkidgames.com/full/angry-birds-2"
    sandbox="allow-scripts allow-forms"
    allow="fullscreen"
    allowfullscreen
    scrolling="no"
    loading="lazy"
    referrerpolicy="no-referrer-when-downgrade">
</iframe>

</body>
</html>
